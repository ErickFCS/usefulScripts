# ---------------------------------------------------------
# Indispensable Defaults
# ---------------------------------------------------------

# Change the Prefix Key
# Ctrl+b is a stretch for your fingers. Ctrl+Space is highly popular 
# and right under your thumbs.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start Window and Pane Indexing at 1
# The '0' key is at the far right of your keyboard; '1' is right next to 'Esc'.
# This makes switching windows with 'Prefix + number' much faster.
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Zero-Delay Escape Time (Crucial for Vi users)
# tmux traditionally waited 500ms after an Esc press to see if it was part 
# of a sequence. Recent versions (3.5+) finally lowered this to 10ms by default, 
# but explicitly setting it guarantees zero lag in your editor across any machine.
set -sg escape-time 10

# Enable Mouse Support
# Even if you are a strict keyboard user, allowing the mouse to quickly drag a 
# pane border to resize it or click to select a window is an excellent fallback.
set -g mouse on

# Sane Split Commands
# '%' and '"' are completely unintuitive. '|' and '-' make visual sense.
# The '-c "#{pane_current_path}"' addition ensures new splits automatically 
# open in the same directory as your current pane.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Increase History Limit
# The default scrollback buffer is only 2000 lines. Let's increase it 
# so you don't lose your compiler errors or log outputs.
set-option -g history-limit 50000
# Enable vi-style keys for buffer exploration and copy mode
set-window-option -g mode-keys vi

# ---------------------------------------------------------
# Pane Navigation (vi-style)
# ---------------------------------------------------------
# Use Prefix + h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------------------------------------------------------
# Copy Mode (vi-style)
# ---------------------------------------------------------
# Use 'v' to begin selection in copy mode (like visual mode in vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use 'Ctrl+v' to toggle rectangle selection (block visual mode)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Use 'y' to yank (copy) the text and send it to the system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
